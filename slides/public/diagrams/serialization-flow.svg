<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="310" viewBox="0 0 1120 310" role="img" aria-labelledby="title desc">
  <title id="title">Le schema entre les données et le modèle</title>
  <desc id="desc">load transforme un dictionnaire en champs validés. Notre code construit ensuite Task. dump transforme un modèle Task en dictionnaire.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#314d47" stroke-width="2"/></marker></defs>
  <g font-family="Arial, sans-serif" text-anchor="middle" fill="#233d37">
    <rect x="10" y="58" width="255" height="112" rx="15" fill="#f0f2ef" stroke="#314d47" stroke-width="2"/>
    <text x="137" y="100" font-size="27" font-weight="bold">Dictionnaire</text><text x="137" y="137" font-size="24">Python</text>
    <rect x="442" y="58" width="255" height="112" rx="15" fill="#f0f2ef" stroke="#314d47" stroke-width="2"/>
    <text x="569" y="100" font-size="27" font-weight="bold">Champs validés</text><text x="569" y="137" font-size="24">data : dict</text>
    <rect x="884" y="58" width="225" height="112" rx="15" fill="#fff5f1" stroke="#b02e47" stroke-width="2"/>
    <text x="996" y="100" font-size="27" font-weight="bold">Modèle Task</text><text x="996" y="137" font-size="24">objet Python</text>
    <path d="M280 110 H423" stroke="#314d47" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <path d="M712 110 H865" stroke="#314d47" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <text x="350" y="39" font-size="25" font-weight="bold">schema.load()</text><text x="790" y="39" font-size="25" font-weight="bold">Task(**data)</text>
    <path d="M996 185 V264 H137 V185" stroke="#314d47" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
    <rect x="384" y="235" width="370" height="58" fill="#faf9f6"/>
    <text x="569" y="257" font-size="26" font-weight="bold">schema.dump(task)</text><text x="569" y="290" font-size="23">dictionnaire de sortie ← attributs</text>
  </g>
</svg>
